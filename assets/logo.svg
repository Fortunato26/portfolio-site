<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="50%" style="stop-color:#f4d03f"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
    <linearGradient id="darkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#darkGradient)" stroke="url(#goldGradient)" stroke-width="2"/>
  
  <!-- Letter G -->
  <text x="58" y="120" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="url(#goldGradient)">G</text>
  
  <!-- Letter F -->
  <text x="108" y="120" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="url(#goldGradient)">F</text>
  
  <!-- Accent line -->
  <rect x="60" y="135" width="80" height="2" fill="url(#goldGradient)"/>
</svg>
